<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0d1b2a"/>
  <!-- Open book pages -->
  <path d="M12 20 Q22 18 32 22 Q42 18 52 20 L52 46 Q42 44 32 48 Q22 44 12 46 Z" fill="#1a3a5c" stroke="#2d6fa0" stroke-width="1"/>
  <!-- Book spine -->
  <line x1="32" y1="22" x2="32" y2="48" stroke="#2d6fa0" stroke-width="1.5"/>
  <!-- Left page lines -->
  <line x1="16" y1="27" x2="29" y2="27" stroke="#4a9fd4" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="31" x2="29" y2="31" stroke="#4a9fd4" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="35" x2="29" y2="35" stroke="#4a9fd4" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="39" x2="29" y2="39" stroke="#4a9fd4" stroke-width="1" opacity="0.5"/>
  <!-- Right page lines -->
  <line x1="35" y1="27" x2="48" y2="27" stroke="#4a9fd4" stroke-width="1" opacity="0.7"/>
  <line x1="35" y1="31" x2="48" y2="31" stroke="#4a9fd4" stroke-width="1" opacity="0.7"/>
  <line x1="35" y1="35" x2="48" y2="35" stroke="#4a9fd4" stroke-width="1" opacity="0.7"/>
  <line x1="35" y1="39" x2="48" y2="39" stroke="#4a9fd4" stroke-width="1" opacity="0.5"/>
  <!-- Sound wave arcs (transcription indicator) -->
  <path d="M32 8 Q37 11 37 16" fill="none" stroke="#4a9fd4" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M32 8 Q27 11 27 16" fill="none" stroke="#4a9fd4" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M32 5 Q39 9 40 17" fill="none" stroke="#2d6fa0" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 5 Q25 9 24 17" fill="none" stroke="#2d6fa0" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- Center dot (microphone tip) -->
  <circle cx="32" cy="8" r="2.5" fill="#4a9fd4"/>
  <!-- Bottom verse reference highlight -->
  <rect x="17" y="41.5" width="12" height="2" rx="1" fill="#4a9fd4" opacity="0.8"/>
</svg>
