name: BibleFlow Tests

on:
    push:
        branches: [feat/bibleflow-integration]
    pull_request:
        branches: [main, master, feat/bibleflow-integration]

jobs:
    unit-tests:
        name: Unit tests — BIBLEFLOW=${{ matrix.bibleflow }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                bibleflow: ["true", "false"]

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies (skip native build scripts)
              run: npm install --ignore-scripts

            - name: Run unit tests
              run: npx vitest run --config config/testing/vitest.config.ts
              env:
                  BIBLEFLOW: ${{ matrix.bibleflow }}

    bundle-size-check:
        name: Bundle size delta (BIBLEFLOW=false must be ≤ 1 KB smaller)
        runs-on: ubuntu-latest
        needs: unit-tests

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm install --ignore-scripts

            - name: Build with BIBLEFLOW=true
              run: npx vite build --outDir dist-bf-on
              env:
                  BIBLEFLOW: "true"

            - name: Build with BIBLEFLOW=false
              run: npx vite build --outDir dist-bf-off
              env:
                  BIBLEFLOW: "false"

            - name: Compare bundle sizes
              run: |
                  ON=$(du -sb dist-bf-on 2>/dev/null | cut -f1 || echo 0)
                  OFF=$(du -sb dist-bf-off 2>/dev/null | cut -f1 || echo 0)
                  DELTA=$(( ON - OFF ))
                  echo "BIBLEFLOW=true  bundle: ${ON} bytes"
                  echo "BIBLEFLOW=false bundle: ${OFF} bytes"
                  echo "Delta (BibleFlow overhead): ${DELTA} bytes"
                  if [ "$DELTA" -gt 1024 ]; then
                    echo "::error::BibleFlow overhead (${DELTA} B) exceeds NFR-01 limit of 1024 B"
                    exit 1
                  fi
